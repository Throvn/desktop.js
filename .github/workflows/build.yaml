name: Build Desktop.js binaries

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x86_64-linux
            arch_name: x86_64
          - os: ubuntu-22.04-arm
            triplet: aarch64-linux
            arch_name: arm64
          # - os: macos-latest
          #   triplet: aarch64-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt install -y libcurl4-openssl-dev build-essential cmake autoconf texinfo libtool libltdl-dev git clang pkg-config git make
          sudo apt install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
          sudo apt install -y build-essential cmake libffi-dev
          clang --version
      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          cd "$GITHUB_WORKSPACE"
          make install

      - name: Build project (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        env:
          TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          cd "$GITHUB_WORKSPACE"
          make main
          mkdir -p "$GITHUB_WORKSPACE/build"
          mv djs-* build/

      - name: Upload artifacts (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: djs-${{ matrix.triplet }}
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files (debug)
        run: ls -R artifacts

      - name: Get latest release tag
        if: startsWith(github.ref, 'refs/tags/') == false
        id: latest
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.latest.outputs.tag }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
