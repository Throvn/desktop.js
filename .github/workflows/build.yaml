name: Build Desktop.js binaries

on:
  push:
    tags:
      - "v*" # only release on tags
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x86_64-linux
            arch_name: x86_64
          - os: ubuntu-22.04-arm
            triplet: aarch64-linux
            arch_name: arm64
          # - os: macos-latest
          #   triplet: aarch64-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest' or  matrix.os == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt install -y \
            libcurl4-openssl-dev build-essential cmake autoconf texinfo \
            libtool libltdl-dev git clang pkg-config make \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build project
        env:
          TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          cd "$GITHUB_WORKSPACE"
          make main

          mkdir -p build/${{ matrix.triplet }}
          mv djs-* build/${{ matrix.triplet }}/

      - name: Upload artifacts (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: djs-${{ matrix.triplet }}
          path: build/${{ matrix.triplet }}/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files (debug)
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
