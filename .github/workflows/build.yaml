name: Build Desktop.js binaries

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: linux-x86_64
          - os: ubuntu-22.04-arm
            triplet: linux-aarch64
          - os: macos-latest
            triplet: darwin-arm64
          - os: macos-26-intel
            triplet: darwin-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt install -y \
          clang \
          build-essential cmake autoconf automake m4 \
          libcurl4-openssl-dev libffi-dev libtool libx11-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          clang --version

      - name: Build dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          make install

      - name: Build project
        env:
          TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          cd "$GITHUB_WORKSPACE"
          make release

          mkdir -p build/
          mv djs-${{ matrix.triplet }} build/

      - name: Upload artifacts (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: djs-${{ matrix.triplet }}
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files (debug)
        run: ls -R artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          files: artifacts/**/*
          overwrite_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
