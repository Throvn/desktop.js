name: Build Desktop.js binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x86_64-linux
            arch_name: x86_64
          - os: ubuntu-22.04-arm
            triplet: aarch64-linux
            arch_name: arm64
          # - os: macos-latest
          #   triplet: aarch64-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt install -y build-essential cmake libffi-dev
          clang --version
      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          cd "$GITHUB_WORKSPACE"
          make install

      - name: Build project (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        env:
          TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          cd "$GITHUB_WORKSPACE"
          make main
          mkdir -p "$GITHUB_WORKSPACE/build"
          mv djs-* build/

      - name: Upload artifacts (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: djs-${{ matrix.triplet }}
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files (debug)
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
